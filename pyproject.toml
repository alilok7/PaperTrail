[project]
name = "paper-trail"
version = "0.1.0"
description = "PaperTrail — a Paper-to-Code Reproducibility Agent that reconciles an ML paper with its implementation and returns a cited verdict."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aliasgar Lokhandwala" }]
dependencies = [
    "docling>=2.0.0",
    "voyageai>=0.3.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langsmith>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.7.0",
    "gitpython>=3.1.0",
    "typer>=0.12.0",
    "streamlit>=1.37.0",
    "pyyaml>=6.0",
]

[project.scripts]
p2c = "paper_to_code.cli:app"

[tool.pytest.ini_options]
# Only collect our own tests. Without this, a bare `pytest` walks the whole tree —
# including gitignored runtime data under data/repos/<cloned repo>, whose conftest.py
# can register incompatible plugins and abort collection.
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "build", "dist", "*.egg-info"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_to_code"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
